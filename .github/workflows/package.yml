# Builds the AppImage, the Windows exe and the macOS dmg on their own systems.
# A v* tag also publishes them as a GitHub release; otherwise they are run artifacts.
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu: an AppImage runs on distros with this glibc or newer.
          - os: ubuntu-22.04
            target: linux
            artifact: dist/gang-branch-2000-x86_64.AppImage
          - os: windows-latest
            target: windows
            artifact: dist/gang-branch-2000-x86_64.exe
          - os: macos-latest
            target: macos
            artifact: dist/gang-branch-2000-macos.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Tests
        if: runner.os == 'Linux'
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          cargo test
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
