[package]
name = "gang-branch-2000"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "links"] }
json5 = "1.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
